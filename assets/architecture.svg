<svg viewBox="0 0 1000 245" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="245" rx="12" fill="#0d1117"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/>
    </marker>
  </defs>

  <text x="500" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf3">From a prompt to a trained robot</text>

  <g>
    <rect x="30"  y="78" width="130" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>
    <rect x="192" y="78" width="130" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>
    <rect x="354" y="78" width="130" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>
    <rect x="516" y="78" width="130" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>
    <rect x="678" y="78" width="130" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>
    <rect x="840" y="78" width="130" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>
  </g>

  <g text-anchor="middle" font-weight="700" fill="#e6edf3" font-size="17">
    <text x="95"  y="115">Prompt</text>
    <text x="257" y="115">Design</text>
    <text x="419" y="115">Build</text>
    <text x="581" y="115">Simulate</text>
    <text x="743" y="115">Learn</text>
    <text x="905" y="115">Export</text>
  </g>
  <g text-anchor="middle" fill="#8b949e" font-size="12">
    <text x="95"  y="139">plain language</text>
    <text x="257" y="139">body + genome</text>
    <text x="419" y="139">CAD + BOM</text>
    <text x="581" y="139">MuJoCo</text>
    <text x="743" y="139">RL on GPU</text>
    <text x="905" y="139">package</text>
  </g>

  <g stroke="#6e7681" stroke-width="2.2">
    <path d="M162 121 L188 121" marker-end="url(#arr)"/>
    <path d="M324 121 L350 121" marker-end="url(#arr)"/>
    <path d="M486 121 L512 121" marker-end="url(#arr)"/>
    <path d="M648 121 L674 121" marker-end="url(#arr)"/>
    <path d="M810 121 L836 121" marker-end="url(#arr)"/>
  </g>

  <path d="M905 164 C 905 204, 257 204, 257 166" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="581" y="214" text-anchor="middle" font-size="12.5" fill="#8b949e">warm-start the next robot</text>
