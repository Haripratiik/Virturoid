<svg viewBox="0 0 1000 395" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="395" rx="12" fill="#0d1117"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <text x="500" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#e6edf3">From a prompt to a trained, buildable robot</text>
  <text x="500" y="74" text-anchor="middle" font-size="14.5" fill="#8b949e">One pipeline, any morphology. Every stage is a real, inspectable artifact.</text>

  <text x="257" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#58a6ff">LLM designs the body</text>
  <text x="743" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#58a6ff">LLM reward critic</text>
  <path d="M257 127 L257 149" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrB)"/>
  <path d="M743 127 L743 149" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrB)"/>

  <g>
    <rect x="30"  y="150" width="130" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>
    <rect x="192" y="150" width="130" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>
    <rect x="354" y="150" width="130" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>
    <rect x="516" y="150" width="130" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>
    <rect x="678" y="150" width="130" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>
    <rect x="840" y="150" width="130" height="118" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2.2"/>
  </g>

  <g text-anchor="middle" font-weight="700" fill="#e6edf3" font-size="18">
    <text x="95"  y="196">Prompt</text>
    <text x="257" y="196">Design</text>
    <text x="419" y="196">Build</text>
    <text x="581" y="196">Simulate</text>
    <text x="743" y="196">Learn</text>
    <text x="905" y="196">Export</text>
  </g>

  <g text-anchor="middle" fill="#8b949e" font-size="12">
    <text x="95"  y="223">plain language</text>

    <text x="257" y="220">anatomy graph</text>
    <text x="257" y="238">Robot Genome</text>

    <text x="419" y="220">actuators + BOM</text>
    <text x="419" y="238">B-rep CAD</text>

    <text x="581" y="223">MuJoCo physics</text>

    <text x="743" y="220">morph policy + PPO</text>
    <text x="743" y="238">on GPU (MJX)</text>

    <text x="905" y="220">controller bundle</text>
    <text x="905" y="238" fill="#58a6ff">evidence-gated</text>
  </g>

  <g stroke="#6e7681" stroke-width="2.2">
    <path d="M162 209 L188 209" marker-end="url(#arr)"/>
    <path d="M324 209 L350 209" marker-end="url(#arr)"/>
    <path d="M486 209 L512 209" marker-end="url(#arr)"/>
    <path d="M648 209 L674 209" marker-end="url(#arr)"/>
    <path d="M810 209 L836 209" marker-end="url(#arr)"/>
  </g>

  <path d="M905 270 C 905 365, 257 365, 257 272" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrB)"/>
  <text x="581" y="361" text-anchor="middle" font-size="13.5" font-weight="600" fill="#58a6ff">Flywheel: every trained robot warm-starts the next</text>
</svg>
