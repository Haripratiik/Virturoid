# Maps each robot joint to the REAL actuator from the bill of materials and the ros2_control interface it
# exposes. Set hardware_plugin to your bus driver (Dynamixel / ODrive / CAN / EtherCAT) before deploying.
hardware:
  hardware_plugin: "REPLACE_WITH_YOUR_DRIVER  # e.g. dynamixel_hardware/DynamixelHardware"
joints:
  neck_joint:
    actuator: "GENERIC position actuator (set from the BOM)"
    command_interface: position
    state_interfaces: [position, velocity]
  tail_joint:
    actuator: "GENERIC position actuator (set from the BOM)"
    command_interface: position
    state_interfaces: [position, velocity]
  leg1_l_0_joint:
    actuator: "GENERIC position actuator (set from the BOM)"
    command_interface: position
    state_interfaces: [position, velocity]
  leg1_l_1_joint:
    actuator: "GENERIC position actuator (set from the BOM)"
    command_interface: position
    state_interfaces: [position, velocity]
  leg1_r_0_joint:
    actuator: "GENERIC position actuator (set from the BOM)"
    command_interface: position
    state_interfaces: [position, velocity]
  leg1_r_1_joint:
    actuator: "GENERIC position actuator (set from the BOM)"
    command_interface: position
    state_interfaces: [position, velocity]
  leg2_l_0_joint:
    actuator: "GENERIC position actuator (set from the BOM)"
    command_interface: position
    state_interfaces: [position, velocity]
  leg2_l_1_joint:
    actuator: "GENERIC position actuator (set from the BOM)"
    command_interface: position
    state_interfaces: [position, velocity]
  leg2_r_0_joint:
    actuator: "GENERIC position actuator (set from the BOM)"
    command_interface: position
    state_interfaces: [position, velocity]
  leg2_r_1_joint:
    actuator: "GENERIC position actuator (set from the BOM)"
    command_interface: position
    state_interfaces: [position, velocity]
