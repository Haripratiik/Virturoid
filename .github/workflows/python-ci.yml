name: Python CI

# WHAT THIS FILE ENFORCES, AND WHAT IT DOES NOT
# =============================================
# Three tiers, in ascending order of what they can prove:
#
#   1. import      (~2 min, every PR)   the package imports and its pure gates hold on 3.10 and 3.12.
#   2. gate/fast   (~5 min, every PR)   the REGRESSION RATCHET: ~176 tests across 20 files, each file tied in
#                                       scripts/ci_gate.py to a defect this repo actually shipped.
#   3. corpus      (~15 min, nightly)   the same idea against the real MuJoCo Menagerie (2.1 GB), which is why
#                                       it is not on the PR path.
#   4. full-suite  (~68 min local, nightly)  the AUTHORITY. Everything above is a fast approximation of it.
#
# THE LIMITS OF TIERS 1-3, stated here because a green check is what people read, not a report:
#
#   * Tier 2 enforces 20 of ~357 test files. Tier 3 adds 5. THE OTHER ~332 ARE NOT GATED ON A PR.
#     `python scripts/ci_gate.py list` prints that count on every run, from the code that owns the list.
#   * A subset has lied here before: 78 tests green on a hand-picked subset while the full suite held 12 reds
#     (2026-07-29). Passing tiers 1-3 is evidence, not proof.
#   * Nothing here runs a GPU, a live LLM, or a multi-hour corpus job.
#   * These tiers are a ratchet on defects ALREADY diagnosed. A new failure mode is invisible until someone
#     writes a test and adds it to scripts/ci_gate.py.
#
# HISTORY THIS REPLACES: until 2026-07-21 the PR jobs named SIX test files out of ~1590 tests, so a regression
# anywhere else was invisible for ten days. The fix then was to add a nightly full suite. That was necessary
# and not sufficient -- a nightly tells you the day AFTER. Tier 2 is the part that runs before merge.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
  schedule:
    - cron: "0 6 * * *"        # nightly: corpus gate + full suite
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite's conftest redirects the memory bank to a temp dir, but CI machines have no developer .env and
  # must not behave as if they might.
  VIRTUROID_NO_LOCAL_ENV: "1"

jobs:
  import:
    name: Import + pure gates (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core package and test runner
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      # pyproject declares requires-python >=3.10, so 3.10 is a SUPPORTED target, not a courtesy. This job is
      # the only thing that would notice 3.11+ syntax landing in the package.
      - name: Run planning, composition, and memory gates
        run: >-
          python -m pytest -q
          tests/test_intent_planner.py
          tests/test_concept_memory.py
          tests/test_gene_validation.py
          tests/test_morphology_composer.py

  gate:
    name: Regression ratchet (fast tier)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install simulation stack
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,sim]"
      # Printed BEFORE the run so the limits are in the log of every job, pass or fail, rather than in a
      # document that only gets read after an incident.
      - name: What this gate enforces, and what it misses
        run: python scripts/ci_gate.py list
      # ci_gate does not just run pytest: it refuses to report green if a listed file contributed zero
      # EXECUTED tests, if any test was skipped because the environment could not run it, or if the executed
      # count fell under the recorded floor. A gate that silently empties is the failure mode being closed.
      - name: Run the fast tier and audit its own coverage
        run: python scripts/ci_gate.py run --tier fast
      - name: Upload the junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-fast
          path: ci-gate-fast.xml
          if-no-files-found: warn

  corpus-gate:
    name: Regression ratchet (real Menagerie)
    # 2.1 GB of robot models. Too heavy for every PR, and the gates it holds (multi-root twins, <mimic>
    # carry-through, the customer's own meshes) are import-side, so a nightly cadence matches how often
    # ingestion changes. Run it on demand before touching robot_import.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install simulation stack
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,sim]"
      - name: Cache the MuJoCo Menagerie checkout
        id: menagerie
        uses: actions/cache@v4
        with:
          path: ~/.cache/robot_descriptions/mujoco_menagerie
          key: menagerie-${{ runner.os }}-v1
      - name: Fetch the MuJoCo Menagerie
        if: steps.menagerie.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/robot_descriptions
          git clone --depth 1 https://github.com/google-deepmind/mujoco_menagerie.git \
            ~/.cache/robot_descriptions/mujoco_menagerie
      - name: What this gate enforces, and what it misses
        run: python scripts/ci_gate.py list --tier corpus
      # If the clone above silently produced nothing, every one of these tests pytest.skips and the run goes
      # green having verified NOTHING. The audit inside ci_gate.py fails the job instead -- measured against a
      # runner with the corpus hidden: pytest said "14 passed, 83 skipped", the gate said no.
      - name: Run the corpus tier and audit its own coverage
        run: python scripts/ci_gate.py run --tier corpus
      - name: Upload the junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-corpus
          path: ci-gate-corpus.xml
          if-no-files-found: warn

  full-suite:
    name: Full suite (nightly + on demand)
    # THE AUTHORITY. Everything above is a fast approximation of this job; when they disagree, this one is
    # right. ~68 minutes on a developer machine, so the timeout carries real headroom for a slower runner --
    # the previous 75 minutes left almost none, and a timed-out nightly protects nothing.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install simulation stack
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,sim]"
      - name: Cache the MuJoCo Menagerie checkout
        id: menagerie
        uses: actions/cache@v4
        with:
          path: ~/.cache/robot_descriptions/mujoco_menagerie
          key: menagerie-${{ runner.os }}-v1
      # Without the corpus, ~83 import-side tests skip and the "full" suite is not full. Fetched here for the
      # same reason it is fetched above: a green run must mean the tests ran.
      - name: Fetch the MuJoCo Menagerie
        if: steps.menagerie.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/robot_descriptions
          git clone --depth 1 https://github.com/google-deepmind/mujoco_menagerie.git \
            ~/.cache/robot_descriptions/mujoco_menagerie
      # No --deselect. The one that used to live here (#185 pick-place) was still excluding a test that now
      # passes in 7.4 s, measured 2026-08-07 -- a temporary blind spot that outlived its cause by weeks. If a
      # test must be excluded again, put the exclusion here with a date and delete it the day it lands.
      - name: Run the whole test suite
        run: python -m pytest -q -rs
      # The suite must not bank into the repo's own memory. tests/ asserts this from the inside; this step
      # asserts it from the outside, where a path the test does not know about would still be caught. Closed
      # 2026-08-07 after a single session took the live bank from 97 to 101 locomotion rows -- four of them
      # carrying a fixture's body class, counted as observations in an analysis of whether the moat has signal.
      - name: The suite must not have written the real memory bank
        if: always()
        run: |
          if [ -e build/memory ]; then
            echo "::error::the test suite created build/memory -- it is banking into the developer's real memory"
            ls -la build/memory
            exit 1
          fi
          echo "build/memory was not created by the suite."
