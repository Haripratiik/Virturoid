name: Python CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core package and test runner
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run planning, composition, and memory gates
        run: >-
          python -m pytest -q
          tests/test_intent_planner.py
          tests/test_concept_memory.py
          tests/test_gene_validation.py
          tests/test_morphology_composer.py

  physics:
    name: Physics package gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install simulation stack
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,sim]"
      - name: Run morphology-matched package evaluations
        run: >-
          python -m pytest -q
          tests/test_task_matched_eval.py
          tests/test_gene_build.py
