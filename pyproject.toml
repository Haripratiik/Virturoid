[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virturoid"
version = "0.1.0"
description = "AI-native robot creation, simulation, training, and export platform."
requires-python = ">=3.10"
# Core import surface (schemas, services, CLIs) needs only numpy at runtime; the heavy engines are extras so
# `pip install -e .` gives an importable package and runnable CLIs without forcing a multi-GB install.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Test runner kept separate from the optional robotics engines so the pure schema,
# planning, and memory gates remain fast and cross-platform.
test = ["pytest>=8"]
# Physics simulation + evaluation + real CAD export (the standard build path: MuJoCo is the engine, build123d
# gives real B-rep STEP/STL so a build emits real CAD, not placeholders).
sim = ["mujoco>=3.0", "Pillow>=10.0", "build123d>=0.5"]
# Real CAD geometry (build123d / OpenCascade) for STEP/STL B-rep export — alias kept for explicit installs.
cad = ["build123d>=0.5"]
# Web app / local UI server.
web = ["fastapi>=0.110", "uvicorn>=0.27"]
# RL / learning stack (policy training, morphology-aware policies).
rl = ["jax>=0.4", "jaxlib>=0.4", "torch>=2.0"]
# Standalone native desktop app (PySide6).  Install with:  pip install -e ".[desktop]"
desktop = ["PySide6-Essentials>=6.6", "mujoco>=3.0"]
# NVIDIA Isaac Sim / Isaac Lab hand-off: OpenUSD physics export. usd-core is the pure-CPU OpenUSD Python binding
# (no GPU / Omniverse needed) so we can WRITE and VALIDATE the USD anywhere; mujoco supplies the source model.
isaac = ["usd-core>=25.8", "mujoco>=3.0"]
# Everything for full local development.
# LLM design backends. The product runs fully OFFLINE without these (default VIRTUROID_LLM_BACKEND=off), but the
# documented "a language model authors the anatomy" flow imports them lazily -- so without this extra, setting
# VIRTUROID_LLM_BACKEND=openai|claude|local on a fresh install raised a bare ModuleNotFoundError.
llm = ["openai>=1.30", "anthropic>=0.34", "requests>=2.31"]
all = ["mujoco>=3.0", "Pillow>=10.0", "build123d>=0.5", "fastapi>=0.110", "uvicorn>=0.27",
       "jax>=0.4", "jaxlib>=0.4", "torch>=2.0", "PySide6-Essentials>=6.6", "usd-core>=25.8",
       "openai>=1.30", "anthropic>=0.34", "requests>=2.31"]

# Console entry points so the CLIs run after `pip install -e .` WITHOUT needing PYTHONPATH=src.
[project.scripts]
virturoid = "virturoid.build:main"
virturoid-build = "virturoid.build:main"
virturoid-autobuild = "virturoid.autobuild:main"
virturoid-compose = "virturoid.compose:main"
virturoid-import = "virturoid.import_robot:main"
virturoid-mvp = "virturoid.mvp:main"
virturoid-studio = "virturoid.desktop:main"
virturoid-desktop = "virturoid.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virturoid = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: physics-heavy or long-running tests (Design-Bench verdict gate, corpus-factory night, DR sweeps)",
]
